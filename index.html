<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="欢迎来到 agents-si 的个人主页。">
  <meta name="color-scheme" content="light">
  <title>agents-si · 欢迎</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #20382f; background: #f5f5ee; }
    .page { width: min(1080px, 100%); margin: auto; padding: 34px 28px; }
    header, footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { font-size: 19px; font-weight: 700; letter-spacing: -.5px; }
    .tag { font-size: 12px; letter-spacing: .12em; color: #5c7166; }
    main { min-height: 72vh; display: grid; grid-template-columns: 1.4fr 1fr; align-items: center; gap: 52px; padding: 72px 0; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .16em; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #619178; }
    h1 { margin: 28px 0 24px; font-size: clamp(42px, 6vw, 72px); line-height: 1.15; font-weight: 650; letter-spacing: -.045em; }
    h1 span { display: block; color: #58836b; }
    .intro { max-width: 440px; color: #5a6b60; font-size: 17px; line-height: 1.9; }
    .button { display: inline-flex; align-items: center; gap: 24px; margin-top: 24px; padding: 15px 21px; border-radius: 99px; background: #244b38; color: white; text-decoration: none; font-size: 14px; }
    .button:hover { background: #38634b; }
    .button:focus-visible { outline: 3px solid #83ad91; outline-offset: 5px; }
    .art { position: relative; aspect-ratio: 1; border-radius: 50% 50% 44% 44%; background: #e2e8d8; overflow: hidden; }
    .sun { position: absolute; width: 25%; aspect-ratio: 1; border-radius: 50%; top: 17%; right: 20%; background: #e6c98a; }
    .hill { position: absolute; width: 150%; height: 70%; border-radius: 50%; transform: rotate(-25deg); bottom: -29%; left: -42%; background: #8fa78a; }
    .hill.front { transform: rotate(25deg); bottom: -38%; left: -2%; background: #476b52; }
    .art-label { position: absolute; bottom: 23px; left: 27px; color: #fff; font-size: 11px; letter-spacing: .19em; }
    footer { padding-top: 24px; border-top: 1px solid #dce2d5; color: #708074; font-size: 12px; line-height: 1.7; }
    @media (max-width: 650px) { .page { padding: 25px 22px; } main { grid-template-columns: 1fr; gap: 42px; padding: 55px 0 45px; } .art { width: min(280px, 85%); justify-self: center; } footer { flex-wrap: wrap; } .tag { font-size: 10px; } }
  </style>
</head>
<body>
  <div class="page">
    <header><div class="brand">agents-si<span aria-hidden="true">.</span></div><div class="tag">A LITTLE SPACE ON THE WEB</div></header>
    <main>
      <section aria-labelledby="welcome">
        <div class="eyebrow">HELLO, WORLD</div>
        <h1 id="welcome">你好，<span>欢迎来到这里。</span></h1>
        <p class="intro">这里是 agents-si 的个人主页。<br>一个新的起点，一片属于自己的小天地。</p>
        <a class="button" href="https://github.com/agents-si">访问我的 GitHub <span aria-hidden="true">↗</span></a>
      </section>
      <div class="art" aria-hidden="true"><div class="sun"></div><div class="hill"></div><div class="hill front"></div><span class="art-label">ROOM TO GROW</span></div>
    </main>
    <footer><span>agents-si · 欢迎常来看看</span><span>Hosted on GitHub Pages</span></footer>
  </div>
</body>
</html>
